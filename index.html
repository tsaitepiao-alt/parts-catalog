<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>零件庫 · 電子元件目錄</title>
<style>
:root{--bg:#0e1116;--panel:#161b23;--line:#26303c;--fg:#e8eef7;--dim:#8b98a9;--acc:#4da3ff;--warn:#ffb42e;--ok:#3ddc97}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
a{color:var(--acc);text-decoration:none}
header{position:sticky;top:0;z-index:50;background:rgba(14,17,22,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 18px 10px}
.hrow{max-width:1180px;margin:0 auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;font-size:17px;letter-spacing:.5px;white-space:nowrap}
.logo span{color:var(--acc)}
#q{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:11px 14px;font-size:15px;outline:none}
#q:focus{border-color:var(--acc)}
.chips{max-width:1180px;margin:10px auto 0;display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip:hover,.chip.on{border-color:var(--acc);color:var(--fg)}
main{max-width:1180px;margin:0 auto;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}
.card img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;display:block}
.card .b{padding:9px 11px 11px}
.card .m{font-size:12.5px;font-weight:600;word-break:break-all;line-height:1.3}
.card .s{font-size:11.5px;color:var(--dim);margin-top:3px;display:flex;justify-content:space-between;gap:6px}
.card .p{color:var(--ok);font-weight:700}
.sec{margin:26px 0 12px;font-size:13px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase}
.scene{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.scene h2{margin:0 0 6px;font-size:20px}
.scene .intro{color:var(--dim);font-size:13.5px;margin-bottom:14px}
.combos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.combo{border:1px solid var(--line);border-radius:12px;padding:13px;background:#11161d}
.combo.best{border-color:var(--acc);box-shadow:0 0 0 1px rgba(77,163,255,.3)}
.combo .tag{font-size:12px;color:var(--acc);font-weight:700;letter-spacing:1px}
.combo .tot{float:right;color:var(--ok);font-weight:700;font-size:13px}
.combo ul{list-style:none;padding:0;margin:9px 0 0}
.combo li{display:flex;gap:9px;align-items:center;padding:5px 0;border-top:1px solid #1d252f;font-size:12.5px}
.combo li img{width:34px;height:34px;object-fit:contain;background:#fff;border-radius:6px}
.combo li .l{color:var(--dim);font-size:11px}
.tabs{display:flex;gap:8px;margin:16px 0 10px}
.tab{padding:7px 14px;border-radius:9px;border:1px solid var(--line);background:#11161d;color:var(--dim);cursor:pointer;font-size:13px}
.tab.on{border-color:var(--acc);color:var(--fg)}
.view{background:#0b0f14;border:1px solid var(--line);border-radius:12px;padding:8px;overflow:auto}
.view img{width:100%;height:auto;display:block}
.warn{margin-top:12px;padding:10px 13px;border-left:3px solid var(--warn);background:rgba(255,180,46,.07);border-radius:0 8px 8px 0;font-size:13px;color:#ffd68a}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;z-index:100;overflow:auto}
#modal.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:860px;width:100%;padding:22px;position:relative}
.sheet h3{margin:0 0 4px;font-size:20px;word-break:break-all}
.sheet .sub{color:var(--dim);font-size:13px;margin-bottom:16px}
.two{display:grid;grid-template-columns:260px 1fr;gap:20px}
.two img{width:100%;border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:6px 8px;border-bottom:1px solid #1d252f;vertical-align:top}
td:first-child{color:var(--dim);width:42%}
.lad{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.lad span{background:#11161d;border:1px solid var(--line);padding:5px 10px;border-radius:8px;font-size:12px}
.btn{display:inline-block;margin-top:14px;padding:9px 16px;border-radius:10px;background:var(--acc);color:#04101f;font-weight:700;font-size:13px}
.close{position:absolute;right:16px;top:14px;cursor:pointer;color:var(--dim);font-size:22px;line-height:1}
footer{max-width:1180px;margin:40px auto 30px;padding:0 18px;color:var(--dim);font-size:12px;border-top:1px solid var(--line);padding-top:16px}
@media(max-width:640px){.two{grid-template-columns:1fr}.sheet{padding:18px}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="logo">零件庫 <span>·</span> 電子元件目錄</div>
    <input id="q" placeholder="搜尋：ESP32 / 藍芽喇叭 / 有螢幕的藍牙喇叭 / TP4056 …" autocomplete="off">
    <div style="color:var(--dim);font-size:12px" id="meta"></div>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main id="main"></main>
<footer>
  圖片來源：<b>LCSC 商品頁原始商品照</b>（保留原廠浮水印，未經修改），各零件頁附 LCSC 原始連結。
  規格與價格為抓取當下快照，實際下單前請以 LCSC 頁面為準。<br>
  本站由自動化流程建置：<code>tools/scrape.py</code> → <code>tools/build.py</code>。
</footer>
<div id="modal"><div class="sheet" id="sheet"></div></div>

<script>
let CAT=null, SCENES=[], PARTS=[], curCat=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

fetch("data/catalog.json").then(r=>r.json()).then(d=>{
  CAT=d; PARTS=d.parts; SCENES=d.scenes;
  $("#meta").textContent=`${d.count} 顆零件 · ${d.scenes.length} 組場景 · ${d.generated}`;
  const cats=[...new Set(PARTS.map(p=>p.category).filter(Boolean))].sort();
  $("#chips").innerHTML=
    `<div class="chip on" data-cat="">全部</div>`+
    SCENES.map(s=>`<div class="chip" data-scene="${s.id}">${s.emoji} ${esc(s.name)}</div>`).join("")+
    cats.map(c=>`<div class="chip" data-cat="${esc(c)}">${esc(c)}</div>`).join("");
  $("#chips").onclick=e=>{
    const t=e.target.closest(".chip"); if(!t)return;
    document.querySelectorAll(".chip").forEach(c=>c.classList.remove("on")); t.classList.add("on");
    if(t.dataset.scene){ $("#q").value=""; renderScene(SCENES.find(s=>s.id===t.dataset.scene)); }
    else { curCat=t.dataset.cat||null; $("#q").value=""; render(); }
  };
  render();
});

function partScore(p,tokens){
  const mpn=(p.mpn||"").toLowerCase(), cat=((p.category||"")+" "+(p.subcategory||"")).toLowerCase(),
        desc=(p.desc||"").toLowerCase(), brand=(p.brand||"").toLowerCase();
  let hay=desc+" "+Object.entries(p.params||{}).map(([k,v])=>k+" "+v).join(" ").toLowerCase();
  let s=0;
  for(const t of tokens){
    if(mpn.includes(t))s+=8;
    if(cat.includes(t))s+=4;
    if(brand.includes(t))s+=3;
    if(hay.includes(t))s+=1.5;
  }
  return s;
}

function sceneScore(sc,q){
  const hay=(sc.name+" "+sc.keywords.join(" ")+" "+sc.intro).toLowerCase();
  if(hay.includes(q)) return 100+q.length;
  let s=0; for(const t of q.split(/\s+/)) if(hay.includes(t)) s+=10;
  return s;
}

function render(){
  const q=($("#q").value||"").trim().toLowerCase();
  let html="";
  if(q){
    const ranked=SCENES.map(s=>({s,k:sceneScore(s,q)})).filter(x=>x.k>0).sort((a,b)=>b.k-a.k);
    ranked.forEach(x=>{ html+=sceneCard(x.s); });
    const tokens=q.split(/\s+/).filter(Boolean);
    const hits=PARTS.map(p=>({p,k:partScore(p,tokens)})).filter(x=>x.k>0).sort((a,b)=>b.k-a.k).slice(0,48);
    if(hits.length) html+=`<div class="sec">符合的零件（${hits.length}）</div>`+grid(hits.map(h=>h.p));
    if(!html) html=`<div class="scene"><h2>找不到「${esc(q)}」</h2><div class="intro">試試：ESP32、藍芽喇叭、顯示器、buck、TP4056、加速度計</div></div>`;
  } else {
    html+=`<div class="sec">從場景開始</div>`+SCENES.map(s=>sceneCard(s)).join("");
    const list=PARTS.filter(p=>!curCat||p.category===curCat)
      .sort((a,b)=>(a.category||"").localeCompare(b.category||""));
    html+=`<div class="sec">${curCat?esc(curCat):"全部零件"}（${list.length}）</div>`+grid(list);
  }
  $("#main").innerHTML=html;
  bindClicks();
}

function grid(list){
  return `<div class="grid">`+list.map(p=>`
    <div class="card" data-code="${p.code}">
      <img src="assets/img/${p.code}.jpg" loading="lazy" alt="${esc(p.mpn)}">
      <div class="b">
        <div class="m">${esc(p.mpn)}</div>
        <div class="s"><span>${esc(p.brand||"")}</span><span class="p">$${(p.price?.q1_usd??0).toFixed(2)}</span></div>
      </div>
    </div>`).join("")+`</div>`;
}

function sceneCard(sc){
  const best=sc.combos[0];
  return `<div class="scene">
    <h2>${sc.emoji} ${esc(sc.name)}</h2>
    <div class="intro">${esc(sc.intro)}</div>
    <div class="combos">${sc.combos.map((c,i)=>`
      <div class="combo ${i===0?"best":""}">
        <span class="tag">方案 ${c.tag} · ${esc(c.label)}</span>
        <span class="tot">US$${c.total_usd}</span>
        <div style="font-size:11.5px;color:#64718a;margin-top:3px">${esc(c.why)}</div>
        <ul>${c.picks.map(pk=>{
          const p=PARTS.find(x=>x.code===pk.code)||{};
          return `<li data-code="${pk.code}"><img src="assets/img/${pk.code}.jpg">
            <div><div>${esc(p.mpn||pk.code)}</div><div class="l">${esc(pk.block)}</div></div></li>`;
        }).join("")}</ul>
      </div>`).join("")}</div>
    <div class="tabs">
      <div class="tab on" data-tab="wiring" data-sc="${sc.id}">🔌 組裝排線圖</div>
      <div class="tab" data-tab="exploded" data-sc="${sc.id}">💥 零件爆炸圖</div>
    </div>
    <div class="view" id="view-${sc.id}"><img src="assets/wiring/${sc.id}.svg" style="width:100%"></div>
    ${sc.warn?`<div class="warn">⚠️ ${esc(sc.warn)}</div>`:""}
  </div>`;
}

function bindClicks(){
  document.querySelectorAll("[data-code]").forEach(el=>{
    el.onclick=e=>{e.stopPropagation();openPart(el.dataset.code);};
  });
  document.querySelectorAll(".tab").forEach(t=>{
    t.onclick=()=>{
      const wrap=t.closest(".scene");
      wrap.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
      t.classList.add("on");
      const id=t.dataset.sc;
      wrap.querySelector(`#view-${id}`).innerHTML=
        `<img src="assets/${t.dataset.tab}/${id}.svg" style="width:100%">`;
    };
  });
}

function openPart(code){
  const p=PARTS.find(x=>x.code===code); if(!p)return;
  const rows=Object.entries(p.params||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("");
  const lad=(p.price?.ladder||[]).map(l=>`<span>${l.q}+ → $${(+l.usd).toFixed(3)}</span>`).join("");
  const alts=(p.alternates||[]).map(a=>`<a href="https://www.lcsc.com/product-detail/${a.code}.html" target="_blank">${esc(a.mpn||a.code)}</a>`).join("、");
  $("#sheet").innerHTML=`
    <div class="close" onclick="closeModal()">✕</div>
    <h3>${esc(p.mpn)}</h3>
    <div class="sub">${esc(p.brand||"")} · ${esc(p.category||"")}${p.subcategory?" / "+esc(p.subcategory):""}</div>
    <div class="two">
      <div>
        <img src="assets/img/${p.code}.jpg" alt="${esc(p.mpn)}">
        <div style="font-size:11px;color:#64718a;margin-top:8px;text-align:center">圖片：LCSC 商品頁原圖</div>
      </div>
      <div>
        <table>
          <tr><td>封裝</td><td>${esc(p.package||"")}</td></tr>
          <tr><td>庫存</td><td>${p.stock??"-"}</td></tr>
          <tr><td>單價 (1pc)</td><td style="color:var(--ok);font-weight:700">$${(p.price?.q1_usd??0).toFixed(4)}</td></tr>
          <tr><td>LCSC 料號</td><td>${esc(p.code)}</td></tr>
          ${rows}
        </table>
        <div class="lad">${lad}</div>
        ${alts?`<div style="font-size:12.5px;color:var(--dim)">替代料：${alts}</div>`:""}
        <a class="btn" href="https://www.lcsc.com/product-detail/${p.code}.html" target="_blank">LCSC 商品頁 →</a>
        ${p.datasheet?`<a class="btn" style="background:#2a3441;color:var(--fg);margin-left:8px" href="${p.datasheet}" target="_blank">Datasheet →</a>`:""}
      </div>
    </div>`;
  $("#modal").classList.add("on");
}
function closeModal(){$("#modal").classList.remove("on");}
$("#modal").onclick=e=>{if(e.target.id==="modal")closeModal();};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
$("#q").addEventListener("input",()=>{clearTimeout(window._t);window._t=setTimeout(render,160);});
</script>
</body>
</html>
